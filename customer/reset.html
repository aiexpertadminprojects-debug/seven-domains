<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password reset — Seven Domains</title><body style="font:16px Arial;max-width:520px;margin:12vh auto;padding:20px"><h1>Password reset</h1><form id="f"><label>New password (12+ characters)<br><input type="password" name="password" minlength="12" maxlength="128" required></label><p><button>Update password</button></p></form><p id="m"></p><script>
const f=document.getElementById('f'),m=document.getElementById('m'),token=new URLSearchParams(location.search).get('token');f.addEventListener('submit',async e=>{e.preventDefault();try{const r=await fetch('/api/auth/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:new FormData(f).get('password')})});const j=await r.json();m.textContent=j.message||j.error;if(j.ok)location.href='/customer/login.html'}catch{m.textContent='Network error'}});
</script></body></html>

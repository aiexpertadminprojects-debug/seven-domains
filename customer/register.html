<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2d"><title>Create account — Seven Domains</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fa;color:#172235;font-family:"DM Sans",sans-serif;padding:20px}.card{width:min(100%,440px);background:white;padding:30px;border:1px solid #e5eaf0;border-radius:18px;box-shadow:0 18px 50px #101b2d12}.brand{font:800 16px Manrope;color:#101b2d}.mark{display:inline-grid;place-items:center;background:#10b981;color:#fff;width:36px;height:36px;border-radius:10px;margin-right:8px}h1{font:800 26px Manrope;margin:25px 0 8px}p{color:#718093;font-size:13px;line-height:1.6}label{display:block;font-size:12px;font-weight:700;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #dce3ea;border-radius:9px;font:14px inherit}button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:9px;background:#10b981;color:#062d22;font-weight:800;font-size:14px}a{color:#078b63}.msg{margin-top:14px;font-size:13px}</style></head><body><main class="card"><div class="brand"><span class="mark">7</span> SEVEN DOMAINS</div><h1>Create your account</h1><p>Register to manage your domains, hosting, orders and support.</p><form id="f"><label>Full name</label><input name="name" required minlength="2" maxlength="100" autocomplete="name"><label>Email address</label><input name="email" type="email" required autocomplete="email"><label>Password (minimum 12 characters)</label><input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"><button>Create account</button></form><div class="msg" id="msg" aria-live="polite"></div><p>Already registered? <a href="/customer/login.html">Sign in</a></p></main><script>
const f=document.getElementById('f'),m=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Creating account…';const d=Object.fromEntries(new FormData(f));try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();m.textContent=j.message||j.error||'Request failed';if(j.ok)f.reset()}catch{m.textContent='Network error. Please try again.'}});
</script></body></html>

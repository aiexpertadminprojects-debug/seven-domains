<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email — Seven Domains</title><body style="font:16px Arial;max-width:520px;margin:15vh auto;padding:20px"><h1>Verify your email</h1><p id="m">Verifying…</p><script>
(async()=>{const token=new URLSearchParams(location.search).get('token');const m=document.getElementById('m');if(!token){m.textContent='Verification token missing.';return}try{const r=await fetch('/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const j=await r.json();m.textContent=j.message||j.error||'Unable to verify';if(j.ok)m.innerHTML+=' <a href="/customer/login.html">Sign in</a>'}catch{m.textContent='Network error'}})();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2d"><title>Sign in — Seven Domains</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fa;color:#172235;font-family:"DM Sans",sans-serif;padding:20px}.card{width:min(100%,420px);background:#fff;padding:30px;border:1px solid #e5eaf0;border-radius:18px;box-shadow:0 18px 50px #101b2d12}.brand{font:800 16px Manrope}.mark{display:inline-grid;place-items:center;background:#10b981;color:#fff;width:36px;height:36px;border-radius:10px;margin-right:8px}h1{font:800 26px Manrope;margin:25px 0 8px}p{color:#718093;font-size:13px;line-height:1.6}label{display:block;font-size:12px;font-weight:700;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #dce3ea;border-radius:9px;font-size:14px}button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:9px;background:#10b981;color:#062d22;font-weight:800;font-size:14px}a{color:#078b63}.msg{margin-top:14px;font-size:13px}</style></head><body><main class="card"><div class="brand"><span class="mark">7</span> SEVEN DOMAINS</div><h1>Welcome back</h1><p>Sign in to your customer account.</p><form id="f"><label>Email address</label><input name="email" type="email" required autocomplete="username"><label>Password</label><input name="password" type="password" required autocomplete="current-password"><button>Sign in</button></form><div class="msg" id="msg" aria-live="polite"></div><p><a href="/customer/reset.html">Forgot password?</a></p><p>New here? <a href="/customer/register.html">Create account</a></p></main><script>
const f=document.getElementById('f'),m=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Signing in…';const d=Object.fromEntries(new FormData(f));try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(j.ok)location.href='/customer/';else m.textContent=j.error||'Sign in failed'}catch{m.textContent='Network error'}});
</script></body></html>
